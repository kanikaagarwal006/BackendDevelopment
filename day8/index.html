<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 8 Gallery</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #0b1120;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      display: block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
  </style>
</head>

<body>

  <h1>Day 8 - Gallery</h1>

  <div class="gallery">
    <img src="./image.png" alt="Day 8 Screenshot">
    <img src="./image copy.png" alt="Day 8 Screenshot">
    <img src="./image copy 2.png" alt="Day 8 Screenshot">
    <img src="./DAY8_BE (1).png" alt="Day 8 Screenshot">
  </div>

</body>
</html>
